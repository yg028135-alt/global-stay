
name: Unpack Global Stay

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o "global-stay-v0.7.1(1).zip" -d .
          rm -f "global-stay-v0.7.1(1).zip"

      - name: Commit source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Global Stay v0.7.1 source"
          git push
          
